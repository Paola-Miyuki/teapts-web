<!doctype html>
<html lang="pt-BR" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · TEA-PTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/teapts-src.css">
<link rel="stylesheet" href="assets/teapts-mockups.css">
</head>
<body class="min-h-full flex flex-col" data-src data-roles="none">
<div class="login-page">
<header class="login-header">
  <div class="login-brand"><span class="inline-flex items-center gap-3"><svg class="w-9 h-9" viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M25 10C15 10 7 17 7 25C7 33 15 40 25 40C35 40 43 32 50 25C57 18 65 10 75 10C85 10 93 17 93 25C93 33 85 40 75 40C65 40 57 32 50 25C43 18 35 10 25 10Z" stroke="url(#logo-signup)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="logo-signup" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#D97706"/><stop offset="50%" stop-color="#2563EB"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs></svg><span class="flex flex-col"><span class="font-sans text-lg tracking-wider font-extrabold text-slate-900">TEA-PTS</span><span class="text-[10px] text-slate-500">Programa Terapêutico Singular</span></span></span></div>
  <button type="button" class="login-helpButton" data-toast="Ajuda (simulação)."><i data-icon="help" class="i-src"></i>Precisa de ajuda?</button>
</header>
<main class="login-main">
<section class="login-login su-signup" aria-labelledby="signup-title">
<div class="login-formWrapper">
  <h1 id="signup-title">Crie sua conta</h1>
  <p class="login-intro">Preencha seus dados para começar.</p>
  <form action="teapts-login.html" novalidate>
    <input type="hidden" name="registered" value="true">
    <div class="ui-field login-field"><label for="photo" class="ui-label">Foto de perfil <span class="pat-optional">(opcional)</span></label><div class="su-photo"><span class="su-avatar" aria-hidden="true"><i data-icon="camera" class="i-src"></i></span><div><button type="button" class="ui-btn ui-btnSecondary su-photoBtn" data-toast="Foto escolhida (simulação).">Escolher foto</button><p class="ui-hint">JPG ou PNG, até 2 MB.</p></div></div></div>
    <div class="su-grid">
      <div class="ui-field login-field"><label for="name" class="ui-label">Nome completo</label><input id="name" name="name" type="text" class="ui-input" placeholder="Digite seu nome completo" required autocomplete="name"></div>
      <div class="ui-field login-field"><label for="social-name" class="ui-label">Nome social <span class="pat-optional">(opcional)</span></label><input id="social-name" name="social-name" type="text" class="ui-input" placeholder="Como você quer ser chamado"></div>
      <div class="ui-field login-field"><label for="birth" class="ui-label">Data de nascimento</label><input id="birth" name="birth" type="date" class="ui-input" required autocomplete="bday"></div>
      <div class="ui-field login-field"><label for="sex" class="ui-label">Sexo</label><select id="sex" name="sex" class="ui-input su-select" required><option value="" selected disabled>Selecione</option><option value="F">Feminino</option><option value="M">Masculino</option></select></div>
      <div class="ui-field login-field"><label for="gender" class="ui-label">Gênero <span class="pat-optional">(opcional)</span></label><select id="gender" name="gender" class="ui-input su-select"><option value="" selected>Selecione</option><option>Mulher cisgênero</option><option>Mulher transgênero</option><option>Homem cisgênero</option><option>Homem transgênero</option><option>Pessoa não binária</option><option>Outro</option><option>Prefiro não informar</option></select></div>
      <div class="ui-field login-field"><label for="cpf" class="ui-label">CPF</label><input id="cpf" name="cpf" type="text" class="ui-input" placeholder="000.000.000-00" required inputmode="numeric" maxlength="14"></div>
      <div class="ui-field login-field"><label for="email" class="ui-label">E-mail</label><input id="email" name="email" type="email" class="ui-input" placeholder="Digite seu e-mail" required autocomplete="email"></div>
      <div class="ui-field login-field"><label for="phone" class="ui-label">Telefone <span class="pat-optional">(opcional)</span></label><input id="phone" name="phone" type="tel" class="ui-input" placeholder="(00) 00000-0000" autocomplete="tel"></div>
      <div class="ui-field login-field"><label for="password" class="ui-label">Criar senha</label><div class="login-passwordWrapper"><input class="ui-input" id="password" name="password" type="password" required autocomplete="new-password" placeholder="Crie uma senha" aria-invalid="false" data-requirements="password-req"><button type="button" class="login-revealButton" data-reveal="password" aria-label="Mostrar senha" aria-pressed="false"></button></div><div class="ui-requirements " id="password-req"><p class="ui-requirementsTitle">Requisitos da senha</p><ul><li data-rule="length"><span aria-hidden="true">•</span> Oito caracteres ou mais</li><li data-rule="number"><span aria-hidden="true">•</span> Pelo menos um número</li></ul></div></div>
      <div class="ui-field login-field"><label for="confirm-password" class="ui-label">Repita a senha</label><div class="login-passwordWrapper"><input class="ui-input" id="confirm-password" name="confirm-password" type="password" required autocomplete="new-password" placeholder="Digite sua senha novamente" aria-invalid="false"><button type="button" class="login-revealButton" data-reveal="confirm-password" aria-label="Mostrar confirmação da senha" aria-pressed="false"></button></div></div>
    </div>
    <button type="submit" class="ui-btn ui-btnPrimary ui-btnBlock login-mainButton">Criar conta</button>
  </form>
  <div class="login-divider"><span>Já tem uma conta?</span></div>
  <a href="teapts-login.html" class="ui-btn ui-btnSecondary ui-btnBlock login-mainButton">Entrar</a>
</div>
</section>
</main>
</div>
<script src="assets/teapts-mockups.js"></script>
</body>
</html>
