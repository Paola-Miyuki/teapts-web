<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · TEA-PTS</title><style>
    
    :root {
      --bg:      oklch(0.98510 0.00000 89.88);   
      --surface: oklch(1 0 0);   
      --fg:      oklch(0.24 0 0);   
      --muted:   oklch(0.48 0 0);   
      --border:  oklch(0.87 0 0);   
      --accent:  oklch(0.84410 0.17274 85.03);   

      
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      
      --fs-h1: clamp(44px, 6vw, 76px);
      --fs-h2: clamp(32px, 4vw, 48px);
      --fs-h3: 22px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;

      
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --container: 1120px;
      --gutter: 32px;

      --radius: 10px;
      --radius-lg: 16px;
    }

    
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    
    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .section {
      padding-block: clamp(48px, 8vw, var(--gap-2xl));
    }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }

    
    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-md);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    
    .topnav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { font-size: 14px; color: var(--muted); }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }

    
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }

    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
    }
    .card-flat { background: transparent; border: 0; padding: 0; }
    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }

    
    .feature .feature-mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      margin-bottom: var(--gap-md);
    }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p  { margin: 0; color: var(--muted); font-size: 15px; }

    
    .stat .stat-num {
      font-family: var(--font-display);
      font-size: clamp(56px, 8vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
      font-weight: 600;
    }
    .stat .stat-label { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 24ch; }
    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }

    
    .quote {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.6vw, 32px);
      line-height: 1.32;
      letter-spacing: -0.01em;
      max-width: 28ch;
    }
    .quote-author { color: var(--muted); font-size: 14px; margin-top: var(--gap-md); }
    .quote-mark   {
      font-family: var(--font-display);
      font-size: 140px; line-height: 0.7;
      color: var(--accent); opacity: 0.18;
      margin-bottom: -28px;
    }

    
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
    }

    
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .input, .textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
    .input:focus, .textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }

    
    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    
    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      aspect-ratio: 16 / 10;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .ph-img.square    { aspect-ratio: 1 / 1; }
    .ph-img.portrait  { aspect-ratio: 3 / 4; }
    .ph-img.wide      { aspect-ratio: 16 / 9; }
    .content-img {
      display: block;
      max-width: 100%;
      max-height: min(70vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
      justify-self: center;
      border-radius: var(--radius-lg);
    }

    
    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }
    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }

    
    .hero          { padding-block: clamp(80px, 12vw, 160px); }
    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }
    .hero h1       { margin-bottom: var(--gap-md); }
    .hero .lead    { margin-bottom: var(--gap-lg); }
    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }
    .hero-center .hero-cta { justify-content: center; }
    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }
    .log-row .meta { color: var(--muted); }
    .log-row h3 { font-size: 19px; }
    .log-row .pull { text-align: right; }

<main id="content" class="login-layout"><section class="section access" data-od-id="login" aria-labelledby="login-title"><div class="form-wrap"><h1 id="login-title" data-od-id="login-title">Bem-vindo de volta!</h1><p class="form-intro">Acesse sua conta TEA-PTS.</p>
<form id="login-form" novalidate data-od-id="login-form"><div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="username" placeholder="Digite seu e-mail" required aria-describedby="email-error" data-od-id="email"><p class="error" id="email-error" aria-live="polite"></p></div>
<div class="field"><label for="password">Senha</label><div class="password-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required aria-describedby="password-error" data-od-id="password"><button class="reveal" type="button" aria-label="Mostrar senha" aria-pressed="false" data-od-id="toggle-password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><p class="error" id="password-error" aria-live="polite"></p></div>
<div class="options"><label class="remember"><input type="checkbox" id="remember" data-od-id="remember">Lembrar meu e-mail</label><button type="button" class="text-button" id="forgot" data-od-id="forgot-password">Esqueci minha senha</button></div>
<p class="submit-message" id="submit-message" role="status"></p><button type="submit" class="btn btn-primary" data-od-id="sign-in" id="sign-in">Entrar</button></form>
<div class="signup-divider" data-od-id="signup-divider"><span>Ainda não tem uma conta?</span></div><button class="btn btn-secondary signup-button" id="create" type="button" data-od-id="create-account">Criar conta</button><p class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/><path d="M12 14v2"/></svg><span>Seu acesso respeita as permissões da sua conta.<br>Informações de saúde exigem cuidado e privacidade.</span></p></div>
</section></main>
<footer class="access-footer" data-od-id="footer"><span>TEA-PTS</span><span aria-hidden="true">·</span><span>Protótipo interativo, sem conexão ao servidor</span></footer>

<dialog id="modal" data-od-id="dialog" aria-labelledby="dialog-title"><button type="button" class="close-dialog" aria-label="Fechar janela" data-od-id="close-dialog">×</button><div id="dialog-content"></div></dialog>
<script>
const $=id=>document.getElementById(id),modal=$('modal');
function openDialog(content){$('dialog-content').innerHTML=content;modal.showModal()}
document.querySelector('.close-dialog').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
document.querySelector('.reveal').onclick=function(){const visible=$('password').type==='password';$('password').type=visible?'text':'password';this.setAttribute('aria-pressed',String(visible));this.setAttribute('aria-label',visible?'Ocultar senha':'Mostrar senha')};
function validate(id){const el=$(id),msg=!el.value.trim()?(id==='email'?'Informe seu e-mail.':'Informe sua senha.'):(id==='email'&&!el.validity.valid?'Informe um e-mail válido, como nome@exemplo.com.':'');$(id+'-error').textContent=msg;el.setAttribute('aria-invalid',String(!!msg));return !msg}
['email','password'].forEach(id=>$(id).addEventListener('input',()=>{if($(id).getAttribute('aria-invalid')==='true')validate(id);$('submit-message').textContent=''}));
try{const saved=localStorage.getItem('teapts-remembered-email');if(saved){$('email').value=saved;$('remember').checked=true}}catch{}
$('remember').onchange=()=>{if(!$('remember').checked)try{localStorage.removeItem('teapts-remembered-email')}catch{}};
$('login-form').onsubmit=e=>{e.preventDefault();const emailValid=validate('email'),passwordValid=validate('password');if(!emailValid||!passwordValid){$(emailValid?'password':'email').focus();return}const button=$('sign-in');button.disabled=true;button.textContent='Verificando…';setTimeout(()=>{try{if($('remember').checked)localStorage.setItem('teapts-remembered-email',$('email').value.trim());else localStorage.removeItem('teapts-remembered-email')}catch{}button.disabled=false;button.textContent='Entrar';$('password').value='';openDialog('<h2 id="dialog-title">Fluxo de entrada validado</h2><p>Os campos foram preenchidos corretamente. Este protótipo demonstra a interação de login, sem autenticar uma conta real.</p><p class="dialog-note">Na aplicação, a confirmação das credenciais e a sessão serão realizadas pelo serviço de autenticação.</p><button class="btn btn-secondary" type="button" onclick="location.href=&quot;pacientes.html&quot;" data-od-id="return-login">Explorar área profissional</button>')},650)};
$('help').onclick=()=>openDialog('<h2 id="dialog-title">Como acessar</h2><p>Use o e-mail e a senha da sua conta TEA-PTS. O acesso aos pacientes e aos planos depende das permissões da sua conta.</p><p>Nesta demonstração, preencha um e-mail válido e uma senha para explorar o fluxo. Nenhuma credencial será enviada a um servidor.</p><button class="btn btn-secondary" type="button" onclick="modal.close()" data-od-id="help-understood">Entendi</button>');
$('forgot').onclick=()=>{openDialog('<h2 id="dialog-title">Recuperar senha</h2><p>Informe o e-mail associado à sua conta.</p><form id="recover-form"><div class="field"><label for="recover-email">E-mail</label><input class="input" type="email" id="recover-email" autocomplete="email" required placeholder="Digite seu e-mail" data-od-id="recovery-email"></div><button class="btn btn-secondary" data-od-id="recover-submit">Solicitar recuperação</button></form><p class="dialog-note" id="recover-status" role="status">Demonstração: nenhum e-mail será enviado.</p>');$('recover-email').value=$('email').value;$('recover-form').onsubmit=e=>{e.preventDefault();$('recover-status').textContent='Solicitação simulada. Na versão conectada, se houver uma conta com este e-mail, você receberá as instruções de recuperação.';$('recover-form').hidden=true}};
$('create').onclick=()=>{openDialog('<h2 id="dialog-title">Crie sua conta</h2><p>Comece com seus dados de acesso.</p><form id="register-form"><div class="field"><label for="new-name">Nome completo</label><input class="input" id="new-name" autocomplete="name" required placeholder="Digite seu nome" data-od-id="register-name"></div><div class="field"><label for="new-email">E-mail</label><input class="input" type="email" id="new-email" autocomplete="email" required placeholder="Digite seu e-mail" data-od-id="register-email"></div><div class="field"><label for="new-password">Senha</label><input class="input" type="password" id="new-password" autocomplete="new-password" required placeholder="Crie uma senha" data-od-id="register-password"></div><button class="btn btn-secondary" data-od-id="register-submit">Criar conta</button></form><p class="dialog-note" id="register-status" role="status">Demonstração: os dados não serão enviados ou salvos.</p>');$('register-form').onsubmit=e=>{e.preventDefault();if(!$('new-name').value.trim()){$('new-name').setCustomValidity('Informe seu nome.');$('new-name').reportValidity();$('new-name').oninput=()=>$('new-name').setCustomValidity('');return}$('register-form').hidden=true;$('register-status').textContent='Cadastro simulado com sucesso. Nenhuma conta real foi criada.';$('new-password').value=''}};

$('create').onclick=()=>{location.href='cadastro.html'};
</script></body></html>
