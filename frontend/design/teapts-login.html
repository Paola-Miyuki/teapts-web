<!doctype html>
<html lang="pt-BR" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · TEA-PTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/teapts-src.css">
<link rel="stylesheet" href="assets/teapts-mockups.css">
</head>
<body class="min-h-full flex flex-col" data-src data-roles="none">
<div class="login-page">
<header class="login-header">
  <div class="login-brand"><span class="inline-flex items-center gap-3"><svg class="w-9 h-9" viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M25 10C15 10 7 17 7 25C7 33 15 40 25 40C35 40 43 32 50 25C57 18 65 10 75 10C85 10 93 17 93 25C93 33 85 40 75 40C65 40 57 32 50 25C43 18 35 10 25 10Z" stroke="url(#logo-login)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="logo-login" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#D97706"/><stop offset="50%" stop-color="#2563EB"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs></svg><span class="flex flex-col"><span class="font-sans text-lg tracking-wider font-extrabold text-slate-900">TEA-PTS</span><span class="text-[10px] text-slate-500">Programa Terapêutico Singular</span></span></span></div>
  <button type="button" class="login-helpButton" data-toast="Ajuda (simulação)."><i data-icon="help" class="i-src"></i>Precisa de ajuda?</button>
</header>
<main class="login-main">
<section class="login-login" aria-labelledby="login-title">
<div class="login-formWrapper">
  <h1 id="login-title">Bem-vindo de volta!</h1>
  <p class="login-intro"></p>
  <div class="ui-alert ui-alertSuccess" role="status" data-if-param="registered" hidden><div class="ui-alertIcon"><i data-icon="check" class="i-src"></i></div><div><strong>Conta criada com sucesso!</strong><p>Faça login para continuar.</p></div></div>
  <form action="inicio.html" novalidate>
    <div class="ui-field login-field"><label for="email" class="ui-label">E-mail</label><input id="email" name="email" type="email" class="ui-input" placeholder="Digite seu e-mail" autocomplete="username" aria-invalid="false"></div>
    <div class="ui-field login-field"><label for="password" class="ui-label">Senha</label><div class="login-passwordWrapper"><input class="ui-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-invalid="false"><button type="button" class="login-revealButton" data-reveal="password" aria-label="Mostrar senha" aria-pressed="false"></button></div></div>
    <div class="login-options">
      <label class="login-remember"><input type="checkbox">Lembrar meu e-mail</label>
      <button type="button" class="login-textButton" data-toast="Recuperação de senha (simulação).">Esqueci minha senha</button>
    </div>
    <button type="submit" class="ui-btn ui-btnPrimary ui-btnBlock login-mainButton">Entrar</button>
  </form>
  <div class="login-divider"><span>Ainda não tem uma conta?</span></div>
  <a href="cadastro.html" class="ui-btn ui-btnSecondary ui-btnBlock login-mainButton">Criar conta</a>
</div>
</section>
</main>
</div>
<script src="assets/teapts-mockups.js"></script>
</body>
</html>
