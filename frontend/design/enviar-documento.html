<!doctype html>
<html lang="pt-BR" class="h-full antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="min-h-full flex flex-col" data-nav="pacientes.html meus-documentos.html" data-roles="professional,admin,patient" data-dps="">
<div class="shell-app">
<aside id="sidebar" class="shell-sidebar"></aside>
<div class="shell-workspace">
<header class="shell-appHeader" id="app-header"></header>
<main class="shell-content">
<nav class="shell-breadcrumb" aria-label="Caminho da página"><a href="inicio.html" data-when="role:admin,professional">Início</a><a href="inicio-paciente.html" data-when="role:patient">Início</a><a href="aguardando-perfil.html" data-when="role:none">Início</a><span class="crumb" data-when="role:admin,professional"><span aria-hidden="true">/</span><a href="pacientes.html">Pacientes</a></span><span class="crumb" data-when="role:admin,professional"><span aria-hidden="true">/</span><a href="paciente.html">Ana Clara Ribeiro</a></span><span class="crumb" data-when="role:admin,professional"><span aria-hidden="true">/</span><a href="paciente.html#documentos">Documentos</a></span><span class="crumb" data-when="role:patient"><span aria-hidden="true">/</span><a href="meus-documentos.html">Documentos</a></span><span class="crumb"><span aria-hidden="true">/</span><span>Enviar documento</span></span></nav>
<div class="mockbar" data-mockbar></div>
<section>
<div class="heading"><div><h1>Enviar documento</h1></div></div>
<form class="ux-formcard" novalidate data-saved="Documento enviado (simulação).">
  <div class="ux-formcard-head"><div><h2>Novo documento</h2></div></div>
  <section class="ux-fsection"><header><h3>Arquivo</h3></header><div><div class="upload-area"><i data-icon="upload" class="icon"></i><strong>Selecione ou arraste um arquivo</strong><small>PDF, PNG, JPG, DOC ou DOCX</small><input type="file" aria-label="Arquivo" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"></div></div></section>
  <section class="ux-fsection"><header><h3>Dados do documento</h3></header><div><div class="form-grid">
    <div class="field full"><label class="field-label" for="doc-title">Título<span class="ux-req" aria-hidden="true"> *</span></label><input class="input" id="doc-title" type="text" value="" aria-required="true" placeholder="Ex.: Laudo neurológico"></div>
    <div class="field "><label class="field-label" for="doc-cat">Categoria<span class="ux-req" aria-hidden="true"> *</span></label><select class="select" id="doc-cat" aria-required="true"><option value="" selected>Selecione a categoria</option><option value="laudo">Laudo médico</option><option value="exame">Exame</option><option value="receita">Receita</option><option value="terapeutico">Relatório terapêutico</option><option value="escolar">Relatório escolar</option><option value="pei">PEI</option><option value="alta">Relatório de alta</option><option value="tcle">TCLE</option><option value="imagem">Autorização de uso de imagem</option><option value="outro">Outro</option></select></div><div class="field "><label class="field-label" for="doc-issued">Data de emissão</label><input class="input" id="doc-issued" type="date" value=""></div>
    <div class="field full"><span class="field-label">Quem emitiu<span class="ux-req" aria-hidden="true"> *</span></span><div class="ux-seg" role="radiogroup" aria-label="Tipo de emissor"><label class="ux-seg-opt ux-seg-primary"><input type="radio" name="emitter-kind" value="reg" data-reveal="emitter" checked>Profissional</label><label class="ux-seg-opt ux-seg-primary"><input type="radio" name="emitter-kind" value="text" data-reveal="emitter">Alguém de fora</label></div><select class="select" aria-label="Profissional emissor" style="margin-top:8px" data-reveal-for="emitter" data-reveal-value="reg" aria-required="true"><option value="">Selecione o profissional ou o administrador</option><option>Ana Souza · Psicólogo</option><option>João Lima · Fonoaudiólogo</option><option>Kaio Felipe · Médico</option><option>Renata Okada · Terapeuta ocupacional</option><option>Camila Rocha · Assistente social</option><option>Joana Prado · Fonoaudiólogo</option><option>Beatriz Lopes · Nutricionista</option><option>Marcos Vieira · Fisioterapeuta</option></select><input class="input" style="margin-top:8px" aria-label="Emissor de fora" placeholder="Ex.: Dra. Lúcia Prado, CRM-PR 33210, Hospital Pequeno Príncipe" data-reveal-for="emitter" data-reveal-value="text" hidden></div>
    <div class="field full"><label class="field-label" for="t-descricao-1">Descrição</label><textarea class="input" id="t-descricao-1" rows="3" placeholder=""></textarea></div>
  </div></div></section>
  <div class="ux-formcard-foot"><a class="btn" href="paciente.html#documentos" data-when="role:admin,professional">Cancelar</a><a class="btn" href="meus-documentos.html" data-when="role:patient">Cancelar</a><button type="submit" class="btn btn-primary"><i data-icon="upload"></i>Enviar documento</button></div>
</form>
</section>
</main>
</div>
</div>
<script src="assets/teapts-mockups.js"></script>
</body>
</html>
